# Copy to local.toml (gitignored). Names of machines and paths that the docs
# refer to as "the handheld" and "the build host". The KMRP step reads the handheld's
# home, game_dir and display (they are part of that step's key); the deploy reads ssh
# and game_dir.

[handheld]
ssh = "handheld"                      # ssh host alias of the device that runs the game
home = "/home/<user>"                 # the handheld user's home, absolute; the KMRP installer records the game's path
game_dir = "~/.local/share/Steam/steamapps/common/swkotor"
display = "1920x1080"                # the panel, as the KMRP installer takes it
proton_dir = "~/.local/share/Steam/steamapps/common/Proton 11.0"
steam_userdata = "~/.local/share/Steam/userdata/<id>"   # background recordings live under gamerecordings/


# Optional. The level the kmrp-controller entry writes to the controller's configs/kmrp-controller.ini:
# 2 logs the pad, the engine's input fields and the minigames' input to kmrp-controller-events.log.
# Changing it rebuilds that entry alone.
# [kmrp]
# debug_logs = 2
