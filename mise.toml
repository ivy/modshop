[tools]
"github:NationalSecurityAgency/ghidra" = "Ghidra_12.1.4_build"
"github:rizinorg/rizin" = { version = "0.9.1", matching = "static-x86_64" }
java = "liberica-21.0.13+11"
node = "26.12.1"
"npm:rea-agents" = "6.5.0"
python = "3.14.9"
"ubi:SteamRE/DepotDownloader" = { version = "DepotDownloader_3.4.0", exe = "DepotDownloader", matching = "linux-x64" }
rust = "1.99.0"
# Our mods' voice recordings: cut and wrapped for the game by ffmpeg, lip-synced by Rhubarb; committed through Git LFS.
"conda:ffmpeg" = "8.0.1"
"github:DanielSWolf/rhubarb-lip-sync" = "1.14.0"
"aqua:git-lfs/git-lfs" = "3.8.1"
# nws on the PATH, for the nwscript plugin and by hand; the build compiles with the shim `nws:build` installs.
"cargo:https://github.com/ivy/nwscript" = { version = "rev:c90437e5c733d051beae11289a9d8adddb444ce3", crate = "nws" }
uv = "0.13.5"

[tasks.check]
description = "lint, format check, type check, tests"
run = ["uv run ruff check .", "uv run ruff format --check .", "uv run pyright", "uv run pytest -q"]

[tasks.test]
run = "uv run pytest"

[tasks."rea:skill"]
description = "copy the REA skill from the pinned rea-agents package into .claude/skills; rerun after bumping it"
run = '''
src="$(mise where npm:rea-agents)/node_modules/rea-agents/skills/reverse-engineer-anything"
rm -rf .claude/skills/reverse-engineer-anything
mkdir -p .claude/skills
cp -R "$src" .claude/skills/
'''

[tasks."nwnnsscomp:build"]
description = "build nwnnsscomp natively from meaglyn/nwn-tools plus patches/nwn-tools into games/kotor/data/tools/"
run = '''
set -eu
root="$PWD"
work="$root/games/kotor/data/build/nwn-tools"
rm -rf "$work"
git clone -q https://github.com/meaglyn/nwn-tools.git "$work"
cd "$work"
git -c advice.detachedHead=false checkout -q ed2c227
git -c user.name=modshop -c user.email=modshop@localhost am -q "$root"/games/kotor/patches/nwn-tools/*.patch
mise x cmake@4 -- cmake . > cmake.log
mise x cmake@4 -- make -j"$(nproc)" nwnnsscomp > make.log
install -D -m 0755 nwnnsscomp/nwnnsscomp "$root/games/kotor/data/tools/nwnnsscomp"
echo "installed $root/games/kotor/data/tools/nwnnsscomp"
'''

[tasks."nws:build"]
description = "build nws and its nwnnsscomp shim at the pinned commit into games/kotor/data/tools/nws/"
env = { NWSCRIPT_REV = "acdeadee6f101e3ff9739ec5b2691a912d39325c" }
run = '''
set -eu
root="$PWD"
work="$root/games/kotor/data/build/nwscript"
rm -rf "$work"
git clone -q "${NWSCRIPT_REPO:-https://github.com/ivy/nwscript.git}" "$work"
cd "$work"
git -c advice.detachedHead=false checkout -q "$NWSCRIPT_REV"
cargo build -q --release --locked -p nws -p nwnnsscomp
install -D -m 0755 target/release/nws "$root/games/kotor/data/tools/nws/nws"
install -D -m 0755 target/release/nwnnsscomp "$root/games/kotor/data/tools/nws/nwnnsscomp"
echo "installed nws and nwnnsscomp at $NWSCRIPT_REV in $root/games/kotor/data/tools/nws/"
'''
